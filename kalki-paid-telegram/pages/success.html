<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kalki Alerts Access</title>
  <style>
    :root{color-scheme:dark;--bg:#070b14;--panel:#101827;--text:#f8fafc;--dim:#94a3b8;--line:#23314b;--gold:#f59e0b;--green:#10b981}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#11251d,#070b14 42%),#070b14;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(760px,calc(100vw - 32px));margin:0 auto;padding:72px 0}.panel{background:rgba(16,24,39,.86);border:1px solid var(--line);border-radius:10px;padding:24px}.eyebrow{margin:0 0 10px;color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:1.8px;font-weight:800}h1{margin:0 0 12px;font-size:clamp(30px,5vw,48px);line-height:1.05}.copy,.result{color:var(--dim);font-size:16px;line-height:1.6}.result{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:8px;background:#080d17}.invite{display:inline-block;margin-top:8px;padding:13px 16px;border-radius:8px;background:var(--green);color:#03120c;text-decoration:none;font-weight:900}a{color:#93c5fd}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="panel">
      <p class="eyebrow">Payment received</p>
      <h1>Your Telegram access is being prepared.</h1>
      <p class="copy">This usually takes a few seconds after Stripe confirms the subscription.</p>
      <div id="result" class="result">Checking subscription...</div>
    </section>
  </main>
  <script>
    const API_BASE = 'https://kalki-paid-telegram.srimanthgada87.workers.dev';
    const result = document.getElementById('result');
    const sessionId = new URLSearchParams(location.search).get('session_id');
    async function check() {
      if (!sessionId) {
        result.textContent = 'Missing checkout session. Contact support.';
        return;
      }
      const res = await fetch(API_BASE + '/api/session?session_id=' + encodeURIComponent(sessionId));
      const json = await res.json();
      if (json.botStartUrl) {
        result.innerHTML = '<p>Your payment is confirmed. Open the Kalki Alerts bot to verify your Telegram account and receive your group invite:</p><a class="invite" href="' + json.botStartUrl + '">Activate in Telegram</a>';
        return;
      }
      result.textContent = 'Still waiting for Stripe confirmation. Refreshing...';
      setTimeout(check, 2500);
    }
    check();
  </script>
</body>
</html>
