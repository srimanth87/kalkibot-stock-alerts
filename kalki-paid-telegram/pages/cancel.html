<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Checkout canceled</title>
  <style>
    :root{color-scheme:dark;--bg:#070b14;--panel:#101827;--text:#f8fafc;--dim:#94a3b8;--line:#23314b;--gold:#f59e0b}
    *{box-sizing:border-box}body{margin:0;background:#070b14;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(720px,calc(100vw - 32px));margin:0 auto;padding:72px 0}.panel{background:rgba(16,24,39,.86);border:1px solid var(--line);border-radius:10px;padding:24px}.eyebrow{margin:0 0 10px;color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:1.8px;font-weight:800}h1{margin:0 0 12px;font-size:42px}.copy{color:var(--dim);line-height:1.6}a{color:#93c5fd}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="panel">
      <p class="eyebrow">Checkout canceled</p>
      <h1>No payment was completed.</h1>
      <p class="copy"><a href="/join.html">Return to signup</a></p>
    </section>
  </main>
</body>
</html>
